---

include:
  - qusal-cache.yml

git:
  baseurl: https://github.com
  prefix: ben-grande/
  branch: main
  maintainers:
    - A3A03DD3ED22D21E653E842B47B7A28B999E0D56

key-dirs:
  - ../qusal-builder/keys/
backend-vmm: xen
debug: true
verbose: true
qubes-release: r4.2
timeout: 3600

skip-git-fetch: false
fetch-versions-only: false

distributions:
  - host-fc37

components:
  - builder-rpm:
      branch: main
      packages: false
      url: https://github.com/QubesOS/qubes-builder-rpm
      maintainers:
        - 0064428F455451B3EBE78A7F063938BA42CFA724
  - qusal:
      url: https://github.com/w4sp0/qubes-config
      verification-mode: less-secure-signed-commits-sufficient
      maintainers:
        - A3A03DD3ED22D21E653E842B47B7A28B999E0D56

executor:
  type: qubes
  options:
    dispvm: "dom0"

stages:
  - fetch
  - pre:
      executor:
        type: local
  - prep
  - build
  - post:
      executor:
        type: local
  - verify
  - sign:
      executor:
        type: local
  - publish:
      executor:
        type: local
  - upload:
      executor:
        type: local

gpg-client: gpg

sign-key:
  rpm: A3A03DD3ED22D21E653E842B47B7A28B999E0D56

repository-publish:
  components: current-testing

# repository-upload-remote-host:
#   rpm: user@yum.example.org:/some/path
